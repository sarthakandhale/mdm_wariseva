<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage & Custody Dashboard – WariSeva</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon">🔐</div>
          <div class="brand-text">Wari<span>Storage</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item active"><a href="../storage/dashboard.html">🔐 Storage Custody Console</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h3>Storage Operator – Chain of Custody Desk</h3>
        </div>
      </header>

      <main class="dashboard-content" id="storageCustodyDashboard">
        <div class="glass-card" style="padding: 1.75rem;">
          <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem;">Found Items Currently in Secure Locker Storage</h2>
          
          <div style="overflow-x: auto;">
            <table class="table" style="width: 100%; border-collapse: collapse;">
              <thead>
                <tr style="text-align: left; border-bottom: 1px solid var(--bg-card-border);">
                  <th style="padding: 0.75rem;">Case #</th>
                  <th style="padding: 0.75rem;">Item Description</th>
                  <th style="padding: 0.75rem;">Found Zone</th>
                  <th style="padding: 0.75rem;">Status</th>
                  <th style="padding: 0.75rem;">Action</th>
                </tr>
              </thead>
              <tbody id="storageCustodyTableBody">
                <!-- Dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/item.js"></script>
  <script>
    Auth.requireAuth();
  </script>
</body>
</html>
