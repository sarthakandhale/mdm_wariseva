<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – ReuniteAI Platform</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .demo-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-sm);
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .demo-chip:hover {
      background: rgba(79, 70, 229, 0.2);
      color: #ffffff;
      border-color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="auth-wrapper">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <a href="index.html" class="brand-logo justify-center" style="margin-bottom: 0.75rem;">
          <div class="brand-icon">🚩</div>
          <div class="brand-text">Reunite<span>AI</span></div>
        </a>
        <h2 style="font-size: 1.4rem;">Sign In to Account</h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Enter mobile number or email address to continue</p>
      </div>

      <div id="loginAlert" style="display:none; margin-bottom: 1.25rem;" class="toast toast-error"></div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="loginIdentifier">Mobile Number or Email</label>
          <input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. 9876543210 or parent@demo.com" required>
          <div class="invalid-feedback">Please provide valid login identifier.</div>
        </div>

        <div class="form-group">
          <div class="d-flex justify-between align-center">
            <label class="form-label" for="loginPassword">Password</label>
            <a href="forgot-password.html" style="font-size:0.8rem;">Forgot Password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="margin-top:0.5rem;">
          Sign In
        </button>
      </form>

      <!-- Quick Demo Credentials Selector -->
      <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--bg-card-border);">
        <div style="font-size: 0.775rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 0.75rem; text-align: center;">
          ⚡ Demo Accounts (1-Click Fill - Pwd: Demo1234!)
        </div>
        <div class="d-flex" style="flex-wrap: wrap; gap: 0.4rem; justify-content: center;">
          <button class="demo-chip" onclick="fillDemo('parent@demo.com')">Parent</button>
          <button class="demo-chip" onclick="fillDemo('volunteer@demo.com')">Volunteer</button>
          <button class="demo-chip" onclick="fillDemo('police@demo.com')">Police</button>
          <button class="demo-chip" onclick="fillDemo('medical@demo.com')">Medical</button>
          <button class="demo-chip" onclick="fillDemo('helpcenter@demo.com')">Help Center</button>
          <button class="demo-chip" onclick="fillDemo('eventadmin@demo.com')">Event Admin</button>
          <button class="demo-chip" onclick="fillDemo('admin@demo.com')">Super Admin</button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account? <a href="register.html" style="font-weight: 600;">Register Now</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/validators.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('loginIdentifier').value = email;
      document.getElementById('loginPassword').value = 'Demo1234!';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('loginSubmitBtn');

      alertBox.style.display = 'none';

      if (!identifier || !password) {
        alertBox.innerText = 'Please enter both mobile/email and password.';
        alertBox.style.display = 'flex';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Authenticating...';

      const res = await APIClient.post('/api/auth/login', { identifier, password });

      submitBtn.disabled = false;
      submitBtn.innerText = 'Sign In';

      if (res.success) {
        Auth.setSession(res.data.session_token, res.data.user);
        Auth.showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = res.data.redirect_url;
        }, 600);
      } else {
        alertBox.innerText = res.message || 'Login failed.';
        alertBox.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
