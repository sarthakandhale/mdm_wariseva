<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found Item Details – WariSeva</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon">🚩</div>
          <div class="brand-text">Wari<span>Seva</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item"><a href="../found-items/found-items.html">← Back to Found Catalog</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h3>Found Item Custody & Claims View</h3>
        </div>
      </header>

      <main class="dashboard-content">
        <div style="max-width: 900px; margin: 0 auto;" id="foundItemDetailsView">
          <!-- Dynamically loaded -->
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    Auth.requireAuth();

    async function loadFoundItemDetailsPage() {
      const container = document.getElementById('foundItemDetailsView');
      const urlParams = new URLSearchParams(window.location.search);
      const caseId = urlParams.get('case_id');

      if (!caseId) {
        container.innerHTML = `<div class="glass-card" style="padding:2rem;">No Case ID specified.</div>`;
        return;
      }

      container.innerHTML = `<div class="glass-card" style="padding:2rem;text-align:center;">Loading found item details...</div>`;

      const res = await APIClient.get(`/api/found-items/${caseId}`);
      if (!res.success) {
        container.innerHTML = `<div class="glass-card" style="padding:2rem;color:var(--color-accent-crimson);">${res.message}</div>`;
        return;
      }

      const c = res.data;
      const l = c.location || {};
      const claims = c.claims || [];
      const custody = c.custody_chain || [];

      container.innerHTML = `
        <!-- Item Header -->
        <div class="glass-card" style="padding:2rem; margin-bottom:1.5rem; border-left:5px solid var(--color-success);">
          <div class="d-flex justify-between align-center" style="flex-wrap:wrap;gap:1rem;">
            <div>
              <div class="d-flex align-center gap-2">
                <h2 style="font-size:1.6rem;">${c.case_number} - ${c.item_name}</h2>
                <span class="badge badge-active">${c.condition} CONDITION</span>
                <span class="badge badge-pending">${c.status}</span>
              </div>
              <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.4rem;">
                Category: <strong>${c.item_category}</strong> | Reported by: <strong>${c.reporter_name}</strong>
              </div>
            </div>
            <div class="d-flex gap-2">
              <a href="../claims/claim-item.html?case_id=${c.id}" class="btn btn-success btn-sm">🙋 Claim Ownership</a>
              <button class="btn btn-primary btn-sm" onclick="releaseFoundItemModal(${c.id})">📦 Official Return & Release</button>
            </div>
          </div>
        </div>

        <!-- Info Grid -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem;">
          <div class="glass-card" style="padding:1.5rem;">
            <h3 style="margin-bottom:1rem; border-bottom:1px solid var(--bg-card-border); padding-bottom:0.5rem;">Item Description & Details</h3>
            <div style="font-size:0.9rem; display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
              <div><span style="color:var(--text-muted)">Brand:</span> <strong>${c.brand || 'N/A'}</strong></div>
              <div><span style="color:var(--text-muted)">Model:</span> <strong>${c.model || 'N/A'}</strong></div>
              <div><span style="color:var(--text-muted)">Color:</span> <strong>${c.color || 'N/A'}</strong></div>
              <div><span style="color:var(--text-muted)">Condition:</span> <strong>${c.condition}</strong></div>
              <div style="grid-column:span 2;"><span style="color:var(--text-muted)">Description:</span> ${c.description}</div>
            </div>
          </div>

          <div class="glass-card" style="padding:1.5rem;">
            <h3 style="margin-bottom:1rem; border-bottom:1px solid var(--bg-card-border); padding-bottom:0.5rem;">Found Spot & Location</h3>
            <div style="font-size:0.9rem; display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
              <div><span style="color:var(--text-muted)">Zone:</span> <strong>${l.zone || 'N/A'}</strong></div>
              <div><span style="color:var(--text-muted)">Landmark:</span> <strong>${l.landmark || 'N/A'}</strong></div>
              <div style="grid-column:span 2;"><span style="color:var(--text-muted)">Location Description:</span> ${l.location_description || 'N/A'}</div>
            </div>
          </div>
        </div>

        <!-- Submitted Claims -->
        <div class="glass-card" style="padding:1.5rem; margin-bottom:1.5rem;">
          <h3 style="margin-bottom:1rem;">🙋 Submitted Owner Claims</h3>
          ${claims.length === 0 ? `<div style="color:var(--text-muted);">No claims submitted yet.</div>` : claims.map(cl => `
            <div style="padding:0.75rem; background:rgba(255,255,255,0.03); border-radius:var(--radius-sm); margin-bottom:0.5rem;" class="d-flex justify-between align-center">
              <div>
                <strong>Claim ${cl.claim_number}:</strong> ${cl.claimant_name} (${cl.claimant_mobile})
                <div style="font-size:0.85rem; color:var(--text-secondary); margin-top:0.25rem;">"${cl.claim_description}"</div>
              </div>
              <div class="d-flex align-center gap-2">
                <span class="badge ${cl.status === 'APPROVED' ? 'badge-active' : 'badge-pending'}">${cl.status}</span>
                ${cl.status === 'SUBMITTED' ? `<button class="btn btn-sm btn-success" onclick="verifyClaimAction(${cl.id}, 'APPROVED')">Approve Claim</button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Chain of Custody History -->
        <div class="glass-card" style="padding:1.5rem;">
          <h3>🔐 Chain of Custody History</h3>
          <div style="margin-top:1rem; display:flex; flex-direction:column; gap:0.5rem;">
            ${custody.map(ch => `
              <div style="padding:0.6rem 1rem; background:rgba(15,23,42,0.6); border-radius:var(--radius-sm); font-size:0.85rem;" class="d-flex justify-between align-center">
                <div>Handled by <strong style="color:var(--color-primary);">${ch.to_user_name}</strong> (${ch.action}): <strong>${ch.to_location}</strong></div>
                <div style="color:var(--text-muted); font-size:0.75rem;">${ch.created_at}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function verifyClaimAction(claimId, status) {
      const notes = prompt("Enter verification notes:", "Owner matched model & cover description");
      if (!notes) return;

      const res = await APIClient.post(`/api/claims/${claimId}/verify`, { status, notes });
      if (res.success) {
        Auth.showToast(`Claim status updated to ${status}!`, 'success');
        loadFoundItemDetailsPage();
      } else {
        Auth.showToast(res.message, 'error');
      }
    }

    async function releaseFoundItemModal(caseId) {
      const returnedTo = prompt("Enter verified owner full name:", "Rajesh Patil");
      if (!returnedTo) return;
      const loc = prompt("Enter handover location:", "Saswad Help Center Storage Tent 2");
      if (!loc) return;

      const res = await APIClient.post(`/api/found-items/${caseId}/release`, {
        returned_to: returnedTo,
        return_location: loc,
        notes: "Identity & claim proof verified before release"
      });

      if (res.success) {
        Auth.showToast('Item officially returned and released!', 'success');
        loadFoundItemDetailsPage();
      } else {
        Auth.showToast(res.message, 'error');
      }
    }

    loadFoundItemDetailsPage();
  </script>
</body>
</html>
