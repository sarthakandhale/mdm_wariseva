<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Found Item – WariSeva</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon">🚩</div>
          <div class="brand-text">Wari<span>Seva</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item active"><a href="../found-items/report-found-item.html">🟢 Register Found Item</a></li>
        <li class="sidebar-item"><a href="../found-items/found-items.html">🔍 Search Found Catalog</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h3>Found Item Registration Wizard</h3>
        </div>
      </header>

      <main class="dashboard-content">
        <div style="max-width: 780px; margin: 0 auto;">
          <div class="glass-card" style="padding: 2.25rem; border-top: 4px solid var(--color-success);">
            <h2 style="font-size:1.5rem; margin-bottom:0.5rem;">Register Found Physical Item</h2>
            <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">
              Register a found physical belonging and assign it to a secure storage locker.
            </p>

            <form id="reportFoundItemForm" onsubmit="handleReportFoundItemSubmit(event)">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="foundCategory">Item Category *</label>
                  <select id="foundCategory" class="form-select" required>
                    <option value="MOBILE_PHONE" selected>Mobile Phone</option>
                    <option value="WALLET">Wallet / Purse</option>
                    <option value="DOCUMENT">Documents / ID Cards</option>
                    <option value="BAG">Bag / Backpack</option>
                    <option value="ELECTRONICS">Electronics / Gadgets</option>
                    <option value="JEWELLERY">Jewellery</option>
                    <option value="KEYS">Keys</option>
                    <option value="EYEWEAR">Spectacles / Eyewear</option>
                    <option value="OTHER">Other Belongings</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="foundName">Item Name *</label>
                  <input type="text" id="foundName" class="form-control" placeholder="e.g. Black Smartphone in Blue Cover" required>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="foundBrand">Brand</label>
                  <input type="text" id="foundBrand" class="form-control" value="Samsung">
                </div>
                <div class="form-group">
                  <label class="form-label" for="foundModel">Model</label>
                  <input type="text" id="foundModel" class="form-control" value="Galaxy Series">
                </div>
                <div class="form-group">
                  <label class="form-label" for="foundColor">Color *</label>
                  <input type="text" id="foundColor" class="form-control" value="Black" required>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="foundCondition">Physical Condition *</label>
                  <select id="foundCondition" class="form-select" required>
                    <option value="NEW">New / Intact</option>
                    <option value="GOOD" selected>Good Condition</option>
                    <option value="DAMAGED">Minor Damage</option>
                    <option value="HEAVILY_DAMAGED">Heavily Damaged</option>
                    <option value="BROKEN">Broken / Screen Cracked</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="foundFacilityName">Storage Locker Location *</label>
                  <input type="text" id="foundFacilityName" class="form-control" value="Saswad Help Center Storage Tent 2 (Locker B-12)" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="foundDesc">Public Item Description *</label>
                <textarea id="foundDesc" class="form-control" rows="2" placeholder="e.g. Found near Saswad halt water dispenser. Has blue silicon cover." required></textarea>
              </div>

              <h4 style="margin-top:1.5rem; margin-bottom:0.75rem; border-bottom:1px solid var(--bg-card-border); padding-bottom:0.4rem;">Found Spot & Zone</h4>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="foundZone">Wari Route Zone *</label>
                  <select id="foundZone" class="form-select" required>
                    <option value="Alandi">Alandi</option>
                    <option value="Pune Route">Pune Route</option>
                    <option value="Saswad" selected>Saswad</option>
                    <option value="Jejuri">Jejuri</option>
                    <option value="Lonand">Lonand</option>
                    <option value="Phaltan">Phaltan</option>
                    <option value="Malshiras">Malshiras</option>
                    <option value="Pandharpur">Pandharpur</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="foundLandmark">Spot Found</label>
                  <input type="text" id="foundLandmark" class="form-control" value="Saswad Halt Water Dispenser 3">
                </div>
              </div>

              <div class="d-flex justify-end align-center" style="margin-top: 1.75rem;">
                <button type="submit" id="submitFoundItemBtn" class="btn btn-success" style="padding:0.8rem 2rem;">🟢 REGISTER FOUND ITEM</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/item.js"></script>
  <script>
    Auth.requireAuth();
  </script>
</body>
</html>
