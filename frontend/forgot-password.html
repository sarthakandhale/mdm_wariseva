<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – ReuniteAI</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="auth-wrapper">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="index.html" class="brand-logo justify-center" style="margin-bottom: 0.5rem;">
          <div class="brand-icon">🔑</div>
          <div class="brand-text">Reunite<span>AI</span></div>
        </a>
        <h2 style="font-size: 1.35rem;">Password Reset</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem;">Recover access to your account</p>
      </div>

      <div id="forgotAlert" style="display:none; margin-bottom: 1.25rem;" class="toast toast-error"></div>

      <!-- Step 1: Request Reset Token -->
      <form id="requestResetForm" onsubmit="handleRequestReset(event)">
        <div class="form-group">
          <label class="form-label" for="resetIdentifier">Mobile Number or Email</label>
          <input type="text" id="resetIdentifier" class="form-control" placeholder="Enter mobile or email" required>
        </div>
        <button type="submit" id="requestBtn" class="btn btn-primary btn-block">
          Request Password Reset Token
        </button>
      </form>

      <!-- Step 2: Set New Password (hidden until token generated) -->
      <form id="confirmResetForm" style="display:none; margin-top:1.5rem;" onsubmit="handleConfirmReset(event)">
        <div class="form-group">
          <label class="form-label" for="resetToken">Reset Token</label>
          <input type="text" id="resetToken" class="form-control" placeholder="Paste reset token here" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Min 8 chars, 1 upper/special" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" class="form-control" placeholder="Re-type new password" required>
        </div>
        <button type="submit" id="confirmBtn" class="btn btn-success btn-block">
          Update Password
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function handleRequestReset(e) {
      e.preventDefault();
      const identifier = document.getElementById('resetIdentifier').value.trim();
      const alertBox = document.getElementById('forgotAlert');
      const btn = document.getElementById('requestBtn');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Generating Token...';

      const res = await APIClient.post('/api/auth/forgot-password', { identifier });

      btn.disabled = false;
      btn.innerText = 'Request Password Reset Token';

      if (res.success) {
        alertBox.className = 'toast toast-success';
        alertBox.innerText = res.message;
        alertBox.style.display = 'flex';
        
        if (res.data.reset_token) {
          document.getElementById('resetToken').value = res.data.reset_token;
        }
        document.getElementById('confirmResetForm').style.display = 'block';
      } else {
        alertBox.className = 'toast toast-error';
        alertBox.innerText = res.message;
        alertBox.style.display = 'flex';
      }
    }

    async function handleConfirmReset(e) {
      e.preventDefault();
      const token = document.getElementById('resetToken').value.trim();
      const new_password = document.getElementById('newPassword').value;
      const confirm_password = document.getElementById('confirmNewPassword').value;
      const alertBox = document.getElementById('forgotAlert');
      const btn = document.getElementById('confirmBtn');

      alertBox.style.display = 'none';

      if (new_password !== confirm_password) {
        alertBox.className = 'toast toast-error';
        alertBox.innerText = 'Passwords do not match.';
        alertBox.style.display = 'flex';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Updating Password...';

      const res = await APIClient.post('/api/auth/reset-password', { token, new_password, confirm_password });

      btn.disabled = false;
      btn.innerText = 'Update Password';

      if (res.success) {
        alertBox.className = 'toast toast-success';
        alertBox.innerText = 'Password updated successfully! Redirecting to login...';
        alertBox.style.display = 'flex';
        setTimeout(() => window.location.href = '/login.html?reset=1', 1500);
      } else {
        alertBox.className = 'toast toast-error';
        alertBox.innerText = res.message;
        alertBox.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
