<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approvals – ReuniteAI</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon">🚩</div>
          <div class="brand-text">Reunite<span>AI</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item"><a href="../admin/dashboard.html">📊 System Statistics</a></li>
        <li class="sidebar-item active"><a href="../admin/pending-users.html">⌛ Pending Approvals</a></li>
        <li class="sidebar-item"><a href="../admin/users.html">👥 Users Directory</a></li>
        <li class="sidebar-item"><a href="../admin/audit-logs.html">📜 Security Audit Logs</a></li>
        <li class="sidebar-item"><a href="../profile.html">👤 My Profile</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left d-flex align-center gap-2">
          <h3>Administrative User Approval Workflow</h3>
          <span class="badge badge-pending" id="pendingCountBadge">0 Pending</span>
        </div>
        <div class="navbar-right">
          <div class="user-profile-btn" onclick="window.location.href="../profile.html"">
            <div class="avatar-circle" id="navUserAvatar">A</div>
            <div>
              <div id="navUserName" style="font-weight:600;font-size:0.875rem;">Administrator</div>
              <div id="navUserRole" style="font-size:0.75rem;color:var(--color-accent-gold);">EVENT ADMIN</div>
            </div>
          </div>
        </div>
      </header>

      <main class="dashboard-content">
        <!-- Filter Header -->
        <div class="glass-card d-flex align-center justify-between" style="padding: 1rem 1.5rem; margin-bottom: 1.5rem;">
          <div class="d-flex align-center gap-2" style="flex-grow: 1; max-width: 450px;">
            <input type="text" id="searchPendingInput" class="form-control" placeholder="Search by name, mobile, or email..." onkeyup="loadPendingUsers()">
          </div>
          <button class="btn btn-secondary btn-sm" onclick="loadPendingUsers()">🔄 Refresh List</button>
        </div>

        <!-- Pending Approvals Table -->
        <div class="glass-card table-responsive" id="pendingUsersTable">
          <table class="data-table">
            <thead>
              <tr>
                <th>Full Name / UUID</th>
                <th>Mobile Number</th>
                <th>Email</th>
                <th>Requested Role</th>
                <th>Registration Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pendingUsersTableBody">
              <!-- Dynamically Populated by dashboard.js -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script>
    Auth.requireAuth(['EVENT_ADMIN', 'SUPER_ADMIN']);
  </script>
</body>
</html>
