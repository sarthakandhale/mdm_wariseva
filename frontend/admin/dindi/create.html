<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Dindi – WariSeva</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../../index.html" class="brand-logo">
          <div class="brand-icon">🚩</div>
          <div class="brand-text">Wari<span>Admin</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item"><a href="../../dindi/directory.html">← Back to Dindi Directory</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h3>Dindi Group Registration Wizard</h3>
        </div>
      </header>

      <main class="dashboard-content">
        <div style="max-width: 780px; margin: 0 auto;">
          <div class="glass-card" style="padding: 2.25rem; border-top: 4px solid var(--color-primary);">
            <h2 style="font-size:1.5rem; margin-bottom:0.5rem;">Register New Warkari Dindi</h2>
            <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">
              Register an official Dindi group participating in the Alandi–Pandharpur Wari.
            </p>

            <form id="createDindiForm" onsubmit="handleCreateDindiSubmit(event)">
              <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="dindiNumber">Dindi Number *</label>
                  <input type="number" id="dindiNumber" class="form-control" placeholder="e.g. 27" value="27" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="dindiName">Dindi Official Name *</label>
                  <input type="text" id="dindiName" class="form-control" placeholder="e.g. Shree Sant Tukaram Maharaj Dindi No. 27" value="Shree Sant Tukaram Maharaj Dindi No. 27" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="dindiDesc">Dindi Description</label>
                <textarea id="dindiDesc" class="form-control" rows="2" placeholder="e.g. Official registered Warkari group travelling Alandi to Pandharpur route">Official registered Warkari group travelling Alandi to Pandharpur route</textarea>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="dindiStartLoc">Starting Point *</label>
                  <input type="text" id="dindiStartLoc" class="form-control" value="Alandi" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="dindiDest">Destination *</label>
                  <input type="text" id="dindiDest" class="form-control" value="Pandharpur" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="dindiExpectedCount">Expected Member Count</label>
                  <input type="number" id="dindiExpectedCount" class="form-control" value="250">
                </div>
              </div>

              <h4 style="margin-top:1.5rem; margin-bottom:0.75rem; border-bottom:1px solid var(--bg-card-border); padding-bottom:0.4rem;">Primary Leader & Emergency Contact</h4>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="dindiContactName">Contact Leader Name *</label>
                  <input type="text" id="dindiContactName" class="form-control" value="Mr. Dindi Leader" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="dindiContactNum">Mobile Contact Number *</label>
                  <input type="text" id="dindiContactNum" class="form-control" value="+91 98220 99999" required>
                </div>
              </div>

              <div class="d-flex justify-end align-center" style="margin-top: 1.75rem;">
                <button type="submit" id="submitDindiBtn" class="btn btn-primary" style="padding:0.8rem 2rem;">🚩 SUBMIT DINDI REGISTRATION</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/dindi.js"></script>
  <script>
    Auth.requireAuth();
  </script>
</body>
</html>
