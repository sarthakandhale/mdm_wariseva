<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crowd Congestion Control – WariSeva</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../../index.html" class="brand-logo">
          <div class="brand-icon">🚦</div>
          <div class="brand-text">Crowd<span>Control</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item active"><a href="../../admin/routes/crowd-zones.html">🚦 Crowd Zones</a></li>
        <li class="sidebar-item"><a href="../../map/wari-map.html">🗺️ Interactive Wari Map</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h3>Route Congestion & Crowd Density Management Console</h3>
        </div>
      </header>

      <main class="dashboard-content">
        <div style="max-width: 800px; margin: 0 auto;">
          <div class="glass-card" style="padding:1.75rem; margin-bottom:1.5rem; border-top:4px solid var(--color-warning);">
            <h2>🚦 Route Crowd Density Controller</h2>
            <p style="color:var(--text-secondary); font-size:0.875rem; margin-top:0.3rem;">
              Update route section crowd level to warn Dindi leaders and optimize pilgrim flow.
            </p>

            <form onsubmit="handleUpdateCrowdSubmit(event)" style="margin-top:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="crowdZoneSelect">Select Route Zone *</label>
                <select id="crowdZoneSelect" class="form-select">
                  <option value="1" selected>Zone Z-SAS-01 (Saswad Dive Ghat Ascent Zone)</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="crowdLevelSelect">Crowd Congestion Level</label>
                <select id="crowdLevelSelect" class="form-select">
                  <option value="LOW">Low (Free Flowing)</option>
                  <option value="MODERATE" selected>Moderate (Normal March Pace)</option>
                  <option value="HIGH">High (Crowded / Slow Moving)</option>
                  <option value="SEVERE">Severe (Halted / Restrict Entry)</option>
                </select>
              </div>

              <button type="submit" class="btn btn-warning btn-block">🚦 UPDATE CROWD CONGESTION LEVEL</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    Auth.requireAuth();

    async function handleUpdateCrowdSubmit(e) {
      e.preventDefault();
      const zoneId = document.getElementById('crowdZoneSelect').value;
      const level = document.getElementById('crowdLevelSelect').value;

      const res = await APIClient.patch(`/api/crowd-zones/${zoneId}`, { crowd_level: level });
      if (res.success) {
        Auth.showToast(`Crowd level updated to ${level}!`, 'success');
      } else {
        Auth.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
