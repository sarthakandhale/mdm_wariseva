<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Registration – WariSeva</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon">🤝</div>
          <div class="brand-text">Wari<span>Seva</span></div>
        </a>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item"><a href="../volunteer/dashboard.html">← Back to Volunteer Desk</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="Auth.logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h3>Volunteer Registration Wizard</h3>
        </div>
      </header>

      <main class="dashboard-content">
        <div style="max-width: 760px; margin:0 auto;">
          <div class="glass-card" style="padding: 2.25rem; border-top: 4px solid var(--color-primary);">
            <h2 style="font-size:1.5rem; margin-bottom:0.5rem;">Register as WariSeva Volunteer</h2>
            <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">
              Join the WariSeva volunteer force assisting Warkari pilgrims during the Alandi–Pandharpur Wari.
            </p>

            <form id="registerVolForm" onsubmit="handleVolRegistrationSubmit(event)">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="volExp">Years of Experience</label>
                  <input type="number" id="volExp" class="form-control" value="2" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="volZone">Preferred Zone *</label>
                  <select id="volZone" class="form-select">
                    <option value="Saswad" selected>Saswad Zone</option>
                    <option value="Pune">Pune City Zone</option>
                    <option value="Jejuri">Jejuri Zone</option>
                    <option value="Pandharpur">Pandharpur Zone</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="volEmerg">Emergency Contact Number *</label>
                <input type="text" id="volEmerg" class="form-control" value="+91 98220 99001" required>
              </div>

              <h4 style="margin-top:1.5rem; margin-bottom:0.75rem; border-bottom:1px solid var(--bg-card-border); padding-bottom:0.4rem;">Skills & Languages</h4>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="volSkill">Primary Skill</label>
                  <select id="volSkill" class="form-select">
                    <option value="FIRST_AID" selected>First Aid & Medical Support</option>
                    <option value="CROWD_MANAGEMENT">Crowd Management</option>
                    <option value="CHILD_ASSISTANCE">Child & Lost Person Assistance</option>
                    <option value="LANGUAGE_SUPPORT">Language & Help Desk Support</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="volLang">Primary Language</label>
                  <select id="volLang" class="form-select">
                    <option value="Marathi" selected>Marathi</option>
                    <option value="Hindi">Hindi</option>
                    <option value="English">English</option>
                    <option value="Odia">Odia</option>
                  </select>
                </div>
              </div>

              <div class="d-flex justify-end align-center" style="margin-top: 1.75rem;">
                <button type="submit" id="submitVolBtn" class="btn btn-primary" style="padding:0.8rem 2rem;">🤝 SUBMIT VOLUNTEER REGISTRATION</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/volunteer.js"></script>
  <script>
    Auth.requireAuth();

    async function handleVolRegistrationSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitVolBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting Registration...';

      const payload = {
        experience_years: parseInt(document.getElementById('volExp').value),
        preferred_zone: document.getElementById('volZone').value,
        emergency_contact: document.getElementById('volEmerg').value,
        skills: [{ skill_name: document.getElementById('volSkill').value, skill_level: 'ADVANCED' }],
        languages: [document.getElementById('volLang').value]
      };

      const res = await APIClient.post('/api/volunteers', payload);
      btn.disabled = false;
      btn.innerText = '🤝 SUBMIT VOLUNTEER REGISTRATION';

      if (res.success) {
        Auth.showToast(`Volunteer registration submitted cleanly!`, 'success');
        setTimeout(() => {
          window.location.href = `/volunteer/dashboard.html`;
        }, 800);
      } else {
        Auth.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
